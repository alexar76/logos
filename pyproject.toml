[project]
# aimarket-logos. Unprefixed short names on PyPI are claimable by strangers whose package can
# install a colliding top-level module (see oracles/core/pyproject.toml for the incident).
name = "aimarket-logos"
version = "0.1.0"
description = "LOGOS — federation-wide analytics engine: cross-hub query, anomaly detection, NL insights via Metis council"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aimarket-oracle-core>=0.2",
    "httpx>=0.27.0",
    "pydantic>=2.0",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.23",
    "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["logos"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
