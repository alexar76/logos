[project]
# aimarket-logos. Unprefixed short names on PyPI are claimable by strangers whose package can
# install a colliding top-level module (see oracles/core/pyproject.toml for the incident).
name = "aimarket-logos"
# Bumped because the tree diverged from the published 0.1.0 wheel: `pip install
# aimarket-logos==0.1.0` served code this tree had already moved past, at the same version
# string, so every fix in it was unpublishable and unreachable.
version = "0.2.2"
description = "LOGOS — federation-wide analytics engine: cross-hub query, anomaly detection, NL insights via Metis council"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aimarket-oracle-core>=0.2",
    "httpx>=0.27.0",
    "pydantic>=2.0",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.23",
    "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["logos"]

# Without a file list hatchling packs whatever lies in the tree that no .gitignore it finds hides.
# On 2026-10-26 a build in a working copy took frontend/node_modules into the sdist (3,885
# files, 25 MB, symlinks among them) and the publish script's secret gate stopped it; built
# where the monorepo's .gitignore is out of reach, data/ (key material) would go the same way.
# An include list cannot be defeated by what happens to lie in the tree (see oracles/core).
[tool.hatch.build.targets.sdist]
include = [
    "/logos",
    "/tests",
    "/README.md",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
