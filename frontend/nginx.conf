server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Gzip
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # Security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header Referrer-Policy no-referrer;

    # Cache static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API proxy — re-resolve backend IP per request (Docker DNS TTL)
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend "http://logos-backend:9460";
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    location /health {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend "http://logos-backend:9460";
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_read_timeout 5s;
    }

    # A2A discovery — before the SPA fallback, or try_files answers the agent
    # card with index.html.
    location = /.well-known/agent-card.json {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend "http://logos-backend:9460";
        proxy_pass $backend;
        proxy_set_header Host $host;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
