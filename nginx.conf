server {
    listen 5199;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header Referrer-Policy no-referrer;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:9460;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
        proxy_buffering off;
    }

    location /health {
        proxy_pass http://127.0.0.1:9460;
        proxy_set_header Host $host;
    }

    # A2A discovery — must be matched before the SPA fallback, or try_files
    # answers the agent card with index.html.
    location = /.well-known/agent-card.json {
        proxy_pass http://127.0.0.1:9460;
        proxy_set_header Host $host;
    }

    # AIMarket federation surface — discovery, manifest, invoke. Same reason as the
    # agent card above: without an exact match the SPA fallback answers a peer's
    # discovery request with index.html, and a hub reads that as "not a peer at all".
    location = /.well-known/ai-market.json {
        proxy_pass http://127.0.0.1:9460;
        proxy_set_header Host $host;
    }

    location /ai-market/ {
        proxy_pass http://127.0.0.1:9460;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
